    }
    .bg-primary {

    }
    .outline-none {

    }
    .text-white {

    .text-24-40 {

    .text-400 {

    .cursor-pointer {

    .hover-50:hover {
        opacity: 75%;

    .border-r {

    }
    .font-family {

    }

    <div class="bg-black-tints-300 h-full grow flex flex-col items-center justify-center gap-y-8">
      <p class="text-white text-24-40 text-400" id="paragraph"></p>
      <button class="p-x-6 p-y-4 rounded-8 bg-primary outline-none text-white text-24-40 text-400 cursor-pointer hover-50" id="reconnect-button"></button>
    </div>

  <script>
    const paragraph = document.getElementById('paragraph')
    const button = document.getElementById('reconnect-button')

    const reconnect = () => {
      window.location.reload()
    }

    button.addEventListener('click', reconnect)

    const paragraphTextMap = {
        'ru-RU': 'Не удалось подключиться к сети',
        'en-GB': 'Failed to connect to the network',
        'zh-CN': '无法连接网络',
        'zh-TW': '無法連線網路'
    }

    const buttonTextMap = {
        'ru-RU': 'Повторное подключение',
        'en-GB': 'Reconnecting',
        'zh-CN': '重连',
        'zh-TW': '重連'
    }

    const locale = localStorage.getItem('i18n') ?? 'ru-RU'

    paragraph.innerText = paragraphTextMap[locale]
    button.innerText = buttonTextMap[locale]
  </script>
