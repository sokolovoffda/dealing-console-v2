publish:
  stage: deploy
  variables:
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"   
  image: ${DOCKER_PROXY_HOST}/docker:latest
  services:
    - name: ${DOCKER_PROXY_HOST}/docker:dind
      command: ["--tls=false"]
  script:
    - export VERSION=$(cat package.json | grep version | head -1 | awk -F= "{ print $2 }" | sed 's/[version:,\",]//g' | tr -d '[[:space:]]')
    - export CONTAINER_RELEASE_IMAGE=$CI_REGISTRY_IMAGE:$VERSION
    - docker build
      --build-arg WUI_REGISTRY_ACCESS_TOKEN=${WUI_REGISTRY_ACCESS_TOKEN}
      --build-arg DOCKER_PROXY_HOST=${DOCKER_PROXY_HOST}
      -t $CONTAINER_RELEASE_IMAGE .
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY --username $CI_REGISTRY_USER --password-stdin
    - docker push $CONTAINER_RELEASE_IMAGE
  only:
    - tag
    - master    
  tags:
    - 'dev-rtu-web-client'

.abstract-docker-deploys:
  stage: deploy
  image: ${DOCKER_PROXY_HOST}/docker:latest
  variables:  
    DOCKER_APP_NAME: "dealing-console"
    DOCKER_APP_PORT: "3333"
  services:
    - name: ${DOCKER_PROXY_HOST}/docker:dind
      command: ["--tls=false"]
  script:
    - docker build 
      --build-arg WUI_REGISTRY_ACCESS_TOKEN=${WUI_REGISTRY_ACCESS_TOKEN}
      --build-arg DOCKER_APP_PORT=${DOCKER_APP_PORT}      
      --build-arg DOCKER_PROXY_HOST=${DOCKER_PROXY_HOST}
      -t vue:nginx .
    - docker stop $DOCKER_APP_NAME || true
    - docker rm $DOCKER_APP_NAME || true
    - docker run --name $DOCKER_APP_NAME --restart=unless-stopped -d -v ssl:/usr/share/nginx/ssl --network="host" vue:nginx
  cache:
    policy: pull

.abstract-deploy-from-docker-build:
  stage: deploy
  image: ${DOCKER_PROXY_HOST}/docker:latest
  services:
    - name: ${DOCKER_PROXY_HOST}/docker:dind
      command: ["--tls=false"]
  script:
    - docker build --no-cache
      --build-arg WUI_REGISTRY_ACCESS_TOKEN=${WUI_REGISTRY_ACCESS_TOKEN}
      --build-arg DOCKER_APP_PORT=${DOCKER_APP_PORT}
      --build-arg DOCKER_PROXY_HOST=${DOCKER_PROXY_HOST}
      -t vue:nginx .
    - docker stop $DOCKER_APP_NAME || true
    - docker rm $DOCKER_APP_NAME || true
    - docker run --cpu-quota="200000" --name $DOCKER_APP_NAME --restart=unless-stopped -d -v ssl:/usr/share/nginx/ssl -v files:/usr/share/nginx/files --network="host" vue:nginx
  cache:
    policy: pull

deploy-backend-stage:
  variables:
    DOCKER_APP_NAME: "dealing-console-ui"
